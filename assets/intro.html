<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;width:100%;height:100px}
  /* One 5.2s timeline; every percentage below is a share of it.
     0-14  wave at the house      14-40 walk to the door
     40-46 door opens, hidden     46-50 out the far side as a graduate, hop
     50-66 walk past the college  60-68 gown fades, suit fades in
     66-78 walk to the employer   78-92 handshake      92-100 hold, fade */
  #walker{animation:move 5.2s linear forwards}
  @keyframes move{
    0%,14%{transform:translate(215px,0)}
    40%,46%{transform:translate(404px,0)}
    47%{transform:translate(492px,0)}
    78%,100%{transform:translate(745px,0)}
  }
  #walker,#employer,#scene{animation-fill-mode:forwards}
  #body{animation:hide 5.2s linear forwards}
  @keyframes hide{0%,41%{opacity:1} 44%,47%{opacity:0} 50%,100%{opacity:1}}
  #all{animation:fadeall 5.2s linear forwards}
  @keyframes fadeall{0%,94%{opacity:1} 100%{opacity:0}}

  #arm{transform-box:fill-box;transform-origin:0% 100%;animation:arm 5.2s linear forwards}
  @keyframes arm{
    0%,76%{opacity:0;transform:rotate(60deg)}
    78%{opacity:1;transform:rotate(60deg)}       /* arm comes forward for the handshake */
    80%,100%{opacity:1;transform:rotate(50deg)}
  }
  #legL,#legR{transform-box:fill-box;transform-origin:50% 0}
  #legL{animation:stepL 5.2s linear forwards}
  #legR{animation:stepR 5.2s linear forwards}
  @keyframes stepL{
    0%,14%{transform:rotate(0)}
    16%{transform:rotate(26deg)} 19%{transform:rotate(-26deg)} 22%{transform:rotate(26deg)} 25%{transform:rotate(-26deg)}
    28%{transform:rotate(26deg)} 31%{transform:rotate(-26deg)} 34%{transform:rotate(26deg)} 37%{transform:rotate(-26deg)} 40%,50%{transform:rotate(0)}
    53%{transform:rotate(26deg)} 56%{transform:rotate(-26deg)} 59%{transform:rotate(26deg)} 62%{transform:rotate(-26deg)}
    65%{transform:rotate(26deg)} 68%{transform:rotate(-26deg)} 71%{transform:rotate(26deg)} 74%{transform:rotate(-26deg)}
    77%{transform:rotate(14deg)} 78%,100%{transform:rotate(0)}
  }
  @keyframes stepR{
    0%,14%{transform:rotate(0)}
    16%{transform:rotate(-26deg)} 19%{transform:rotate(26deg)} 22%{transform:rotate(-26deg)} 25%{transform:rotate(26deg)}
    28%{transform:rotate(-26deg)} 31%{transform:rotate(26deg)} 34%{transform:rotate(-26deg)} 37%{transform:rotate(26deg)} 40%,50%{transform:rotate(0)}
    53%{transform:rotate(-26deg)} 56%{transform:rotate(26deg)} 59%{transform:rotate(-26deg)} 62%{transform:rotate(26deg)}
    65%{transform:rotate(-26deg)} 68%{transform:rotate(26deg)} 71%{transform:rotate(-26deg)} 74%{transform:rotate(26deg)}
    77%{transform:rotate(-14deg)} 78%,100%{transform:rotate(0)}
  }
  #backpack{animation:pack 5.2s linear forwards}
  @keyframes pack{0%,41%{opacity:1} 44%,100%{opacity:0}}
  #grad{animation:grad 5.2s linear forwards}
  @keyframes grad{0%,46%{opacity:0} 49%,60%{opacity:1} 68%,100%{opacity:0}}
  #suit{animation:suit 5.2s linear forwards}
  @keyframes suit{0%,60%{opacity:0} 68%,100%{opacity:1}}
  #tassel{transform-box:fill-box;transform-origin:50% 0%;animation:tassel 5.2s linear forwards}
  @keyframes tassel{0%,49%{transform:rotate(0)} 52%{transform:rotate(22deg)} 55%{transform:rotate(-16deg)} 58%,100%{transform:rotate(0)}}
  #doorpanel{transform-box:fill-box;transform-origin:0% 50%;animation:door 5.2s linear forwards}
  @keyframes door{0%,37%{transform:scaleX(1)} 41%,49%{transform:scaleX(0.14)} 54%,100%{transform:scaleX(1)}}
  #bob{animation:bob 5.2s linear forwards}
  @keyframes bob{0%,47%{transform:translateY(0)} 49%{transform:translateY(-7px)} 51%,100%{transform:translateY(0)}}

  /* employer: waits, then arm comes out and the two shake */
  #emparm{transform-box:fill-box;transform-origin:100% 100%;animation:emparm 5.2s linear forwards}
  @keyframes emparm{0%,76%{transform:rotate(-70deg)} 80%,100%{transform:rotate(0deg)}}
  #shake,#shake2{animation:shake 5.2s linear forwards}
  @keyframes shake{
    0%,80%{transform:translateY(0)} 82%{transform:translateY(2.5px)} 84%{transform:translateY(-2.5px)}
    86%{transform:translateY(2.5px)} 88%{transform:translateY(-2.5px)} 90%{transform:translateY(2px)} 92%,100%{transform:translateY(0)}
  }
  #empeyes{animation:blink 5.2s linear forwards}
  @keyframes blink{0%,30%{transform:scaleY(1)} 31%{transform:scaleY(0.1)} 32%,70%{transform:scaleY(1)} 71%{transform:scaleY(0.1)} 72%,100%{transform:scaleY(1)}}
  #empeyes{transform-box:fill-box;transform-origin:50% 50%}

  /* parents: wave while he waves, then arms down */
  #momarm,#dadarm{transform-box:fill-box;transform-origin:0% 100%}
  #momarm{animation:pwave 5.2s linear forwards}
  #dadarm{animation:pwave 5.2s linear forwards;animation-delay:-0.25s}
  @keyframes pwave{
    0%{transform:rotate(-15deg)} 3%{transform:rotate(25deg)} 6%{transform:rotate(-15deg)}
    9%{transform:rotate(25deg)} 12%{transform:rotate(-15deg)} 15%{transform:rotate(25deg)}
    18%{transform:rotate(-15deg)} 21%{transform:rotate(25deg)} 24%{transform:rotate(-15deg)}
    27%{transform:rotate(25deg)} 30%{transform:rotate(-15deg)} 33%{transform:rotate(25deg)}
    36%{transform:rotate(-15deg)} 39%{transform:rotate(25deg)} 44%,100%{transform:rotate(95deg)}
  }
</style></head>
<body>
<svg viewBox="0 0 900 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<g id="all">
  <!-- ground: a soft band -->
  <rect x="30" y="80" width="840" height="8" rx="4" fill="#f0efec"/>

  <g id="scene">
    <!-- ===== left: house and mailbox ===== -->
    <!-- house -->
    <rect x="34" y="46" width="52" height="36" rx="3" fill="#f6efe6"/>
    <path d="M28 50 L60 24 L92 50 Z" fill="#d9897a"/>
    <rect x="72" y="28" width="7" height="12" rx="1" fill="#b9746a"/>          <!-- chimney -->
    <rect x="42" y="56" width="11" height="10" rx="1.5" fill="#bcd7ea"/>       <!-- window -->
    <rect x="66" y="56" width="11" height="10" rx="1.5" fill="#bcd7ea"/>
    <rect x="54" y="64" width="12" height="18" rx="2" fill="#9B2247"/>         <!-- front door -->
    <circle cx="63" cy="74" r="1" fill="#f6d36b"/>
    <ellipse cx="60" cy="86" rx="40" ry="2" fill="#e6e3dd" opacity=".6"/>
    <!-- mailbox -->
    <rect x="101" y="62" width="3" height="20" rx="1" fill="#8b8f94"/>
    <rect x="94" y="52" width="18" height="12" rx="5" fill="#5c6670"/>
    <rect x="94" y="56" width="18" height="8" fill="#5c6670"/>
    <rect x="110" y="46" width="2.5" height="9" rx="1" fill="#e2563f"/>         <!-- flag -->
    <rect x="106" y="46" width="7" height="4" rx="1" fill="#e2563f"/>
    <!-- a little tree, behind the parents -->
    <rect x="288" y="62" width="4" height="20" rx="1.5" fill="#a07a56"/>
    <circle cx="290" cy="54" r="13" fill="#b7d9a5"/>
    <circle cx="282" cy="60" r="8" fill="#a6cf93"/>

    <!-- parents, seeing him off -->
    <g id="parents" transform="translate(156,0)">
      <!-- dad -->
      <g transform="translate(0,0)">
        <path d="M-11 60 L11 60 L13 82 L-13 82 Z" fill="#6f8f6a"/>
        <line x1="-4" y1="76" x2="-4" y2="82" stroke="#FFC627" stroke-width="4" stroke-linecap="round"/>
        <line x1="4" y1="76" x2="4" y2="82" stroke="#FFC627" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="52" r="14" fill="#FFC627"/>
        <ellipse cx="-4" cy="45" rx="5" ry="3.5" fill="#fff" opacity=".12"/>
        <circle cx="5" cy="49" r="3" fill="#fff"/><circle cx="10" cy="49" r="3" fill="#fff"/>
        <circle cx="6" cy="49.5" r="1.3" fill="#1a1a1a"/><circle cx="11" cy="49.5" r="1.3" fill="#1a1a1a"/>
        <path d="M4 56 Q8 59 12 56" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M-2 43 Q8 36 13 44" stroke="#5b4636" stroke-width="3" fill="none" stroke-linecap="round"/>  <!-- hair -->
        <g transform="translate(11,54)">
          <line id="dadarm" x1="0" y1="0" x2="11" y2="-11" stroke="#FFC627" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </g>
      <!-- mom -->
      <g transform="translate(-38,4)">
        <path d="M-11 58 L11 58 L14 78 L-14 78 Z" fill="#d98a7a"/>
        <line x1="-4" y1="72" x2="-4" y2="78" stroke="#c9826e" stroke-width="4" stroke-linecap="round"/>
        <line x1="4" y1="72" x2="4" y2="78" stroke="#c9826e" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="50" r="13" fill="#c9826e"/>
        <circle cx="-9" cy="40" r="5" fill="#c9826e"/>                                   <!-- bun -->
        <ellipse cx="-4" cy="44" rx="5" ry="3.5" fill="#fff" opacity=".12"/>
        <circle cx="5" cy="47" r="3" fill="#fff"/><circle cx="10" cy="47" r="3" fill="#fff"/>
        <circle cx="6" cy="47.5" r="1.3" fill="#1a1a1a"/><circle cx="11" cy="47.5" r="1.3" fill="#1a1a1a"/>
        <path d="M4 54 Q8 57 12 54" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <g transform="translate(10,52)">
          <line id="momarm" x1="0" y1="0" x2="11" y2="-11" stroke="#c9826e" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ===== door ===== -->
    <rect x="422" y="20" width="56" height="62" rx="4" fill="#efe8de"/>
    <rect id="doorpanel" x="428" y="26" width="44" height="56" rx="2.5" fill="#b07a4f"/>
    <rect x="433" y="31" width="34" height="18" rx="2" fill="#a06d44"/>
    <rect x="433" y="54" width="34" height="22" rx="2" fill="#a06d44"/>
    <circle cx="465" cy="55" r="2" fill="#f6d36b"/>

    <!-- ===== right: college ===== -->
    <!-- lawn -->
    <ellipse cx="610" cy="84" rx="110" ry="4" fill="#e4efdc"/>
    <!-- building -->
    <rect x="552" y="40" width="112" height="42" fill="#ece6dc"/>
    <path d="M546 42 L608 18 L670 42 Z" fill="#dcd4c6"/>
    <rect x="546" y="40" width="124" height="5" rx="1" fill="#d2c9ba"/>
    <rect x="560" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="579" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="598" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="617" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="636" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="655" y="47" width="7" height="35" rx="2" fill="#fbf9f5"/>
    <rect x="603" y="62" width="10" height="20" rx="1.5" fill="#6b5a4a"/>     <!-- entrance -->
    <circle cx="608" cy="31" r="4" fill="#fff" opacity=".9"/>                   <!-- clock -->
    <line x1="608" y1="31" x2="608" y2="28.5" stroke="#6b5a4a" stroke-width="1"/>
    <line x1="608" y1="31" x2="610" y2="31" stroke="#6b5a4a" stroke-width="1"/>
    <!-- flag -->
    <rect x="672" y="30" width="2" height="52" fill="#8b8f94"/>
    <path d="M674 31 L690 35 L674 39 Z" fill="#9B2247"/>
    <!-- trees -->
    <rect x="528" y="64" width="4" height="18" rx="1.5" fill="#a07a56"/>
    <circle cx="530" cy="56" r="11" fill="#b7d9a5"/>
    <rect x="704" y="66" width="4" height="16" rx="1.5" fill="#a07a56"/>
    <circle cx="706" cy="58" r="10" fill="#a6cf93"/>
  </g>

  <!-- ===== employer, waiting at the right ===== -->
  <g id="employer" transform="translate(800,0)">
    <g id="shake2">
      <path d="M-13 62 L13 62 L16 82 L-16 82 Z" fill="#2f3f55"/>
      <polygon points="-5,62 5,62 0,70" fill="#ffffff"/>
      <polygon points="-1.5,64 1.5,64 2.5,74 0,77 -2.5,74" fill="#7a8ba3"/>
      <line x1="-5" y1="74" x2="-5" y2="82" stroke="#5b6b7f" stroke-width="4" stroke-linecap="round"/>
      <line x1="5" y1="74" x2="5" y2="82" stroke="#5b6b7f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="58" r="16" fill="#5b6b7f"/>
      <ellipse cx="-5" cy="50" rx="6" ry="4" fill="#fff" opacity=".12"/>
      <g id="empeyes">
        <circle cx="-11" cy="54" r="3.4" fill="#fff"/><circle cx="-5" cy="54" r="3.4" fill="#fff"/>
        <circle cx="-12" cy="54.5" r="1.5" fill="#1a1a1a"/><circle cx="-6" cy="54.5" r="1.5" fill="#1a1a1a"/>
        <!-- glasses -->
        <circle cx="-11" cy="54" r="4.6" fill="none" stroke="#1f2a3a" stroke-width="1"/>
        <circle cx="-5" cy="54" r="4.6" fill="none" stroke="#1f2a3a" stroke-width="1"/>
        <line x1="-6.6" y1="54" x2="-9.4" y2="54" stroke="#1f2a3a" stroke-width="1"/>
      </g>
      <path d="M-14 62 Q-8 66 -3 62" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g transform="translate(-12,56)">
        <line id="emparm" x1="0" y1="0" x2="-16" y2="-2" stroke="#5b6b7f" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- ===== walker ===== -->
  <g id="walker">
    <g id="body">
      <g id="bob">
        <g id="shake">
        <!-- gown -->
        <g id="grad">
          <path d="M-14 62 L14 62 L18 82 L-18 82 Z" fill="#2b2b2b"/>
          <polygon points="-21,41 0,33 21,41 0,49" fill="#1a1a1a"/>
          <rect x="-9" y="41" width="18" height="6" fill="#1a1a1a"/>
          <line id="tassel" x1="19" y1="40" x2="19" y2="56" stroke="#f6d36b" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- suit -->
        <g id="suit">
          <path d="M-13 62 L13 62 L16 82 L-16 82 Z" fill="#1f3a5f"/>
          <polygon points="-5,62 5,62 0,70" fill="#ffffff"/>
          <polygon points="-1.5,64 1.5,64 2.5,74 0,77 -2.5,74" fill="#9B2247"/>
          <rect x="-33" y="68" width="15" height="11" rx="2" fill="#6b4a2b"/>
          <rect x="-28" y="66" width="5" height="2.5" rx="1" fill="#6b4a2b"/>
        </g>
        <!-- backpack -->
        <g id="backpack">
          <rect x="-27" y="50" width="14" height="20" rx="5" fill="#3b7dd8"/>
          <rect x="-26" y="50" width="12" height="7" rx="3.5" fill="#2f63ad"/>
          <line x1="-14" y1="55" x2="-6" y2="49" stroke="#2f63ad" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- legs -->
        <line id="legL" x1="-5" y1="74" x2="-5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
        <line id="legR" x1="5" y1="74" x2="5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
        <!-- the dot -->
        <circle cx="0" cy="58" r="16" fill="#9B2247"/>
        <ellipse cx="-5" cy="50" rx="6" ry="4" fill="#fff" opacity=".14"/>
        <circle cx="5" cy="54" r="3.4" fill="#fff"/><circle cx="11" cy="54" r="3.4" fill="#fff"/>
        <circle cx="6" cy="54.5" r="1.5" fill="#1a1a1a"/><circle cx="12" cy="54.5" r="1.5" fill="#1a1a1a"/>
        <circle cx="6.6" cy="53.6" r=".5" fill="#fff"/><circle cx="12.6" cy="53.6" r=".5" fill="#fff"/>
        <path d="M4 62 Q9 66 14 62" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- arm: waves at the start, shakes hands at the end -->
        <g transform="translate(12,54)">
          <line id="arm" x1="0" y1="0" x2="12" y2="-12" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
        </g>
        </g>
      </g>
    </g>
  </g>
</g>
</svg>
</body></html>
