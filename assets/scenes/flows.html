<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;width:100%;height:90px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  #eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 12s linear infinite}
  @keyframes blink{0%,45%{transform:scaleY(1)} 46%{transform:scaleY(.1)} 47%,78%{transform:scaleY(1)} 79%{transform:scaleY(.1)} 80%,100%{transform:scaleY(1)}}

  #plane{offset-path:path("M290 50 C 350 50, 380 26, 470 26");offset-rotate:auto;animation:fly 12s linear infinite;opacity:0}
  @keyframes fly{0%,4%{offset-distance:0%;opacity:0} 6%{opacity:1} 30%{offset-distance:100%;opacity:1} 33%,100%{offset-distance:100%;opacity:0}}
  #arm{transform-box:fill-box;transform-origin:0% 100%;animation:throw 12s linear infinite}
  @keyframes throw{0%{transform:rotate(-70deg)} 4%{transform:rotate(-70deg)} 7%{transform:rotate(10deg)} 40%{transform:rotate(10deg)} 46%,100%{transform:rotate(60deg)}}
  #plane2{offset-path:path("M290 58 C 350 58, 380 70, 470 70");offset-rotate:auto;animation:fly2 12s linear infinite;opacity:0}
  @keyframes fly2{0%,18%{offset-distance:0%;opacity:0} 20%{opacity:1} 42%{offset-distance:100%;opacity:1} 45%,100%{offset-distance:100%;opacity:0}}
</style></head>
<body><svg viewBox="0 0 300 90" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
  <rect x="10" y="80" width="280" height="7" rx="3.5" fill="#f0efec"/>
<g transform="translate(-205,0)">

  <path d="M290 50 C 350 50, 380 26, 470 26" fill="none" stroke="#d9d2e9" stroke-width="7" stroke-linecap="round"/><path d="M290 54 C 350 54, 380 48, 470 48" fill="none" stroke="#d9ead3" stroke-width="7" stroke-linecap="round"/><path d="M290 58 C 350 58, 380 70, 470 70" fill="none" stroke="#f9cb9c" stroke-width="7" stroke-linecap="round"/>
  <g id="plane"><polygon points="-6,-3 6,0 -6,3 -3,0" fill="#fff" stroke="#5b6b7f" stroke-width="1.2" stroke-linejoin="round"/></g>
  <g id="plane2"><polygon points="-6,-3 6,0 -6,3 -3,0" fill="#fff" stroke="#5b6b7f" stroke-width="1.2" stroke-linejoin="round"/></g>
  
  <g id="guy" transform="translate(255,0)">
    
    <line id="legL" x1="-5" y1="74" x2="-5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <line id="legR" x1="5" y1="74" x2="5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="58" r="16" fill="#9B2247"/>
    <ellipse cx="-5" cy="50" rx="6" ry="4" fill="#fff" opacity=".14"/>
    <g id="eyes">
      <circle cx="5" cy="54" r="3.4" fill="#fff"/><circle cx="11" cy="54" r="3.4" fill="#fff"/>
      <circle cx="6" cy="54.5" r="1.5" fill="#1a1a1a"/><circle cx="12" cy="54.5" r="1.5" fill="#1a1a1a"/>
    </g>
    <path d="M4 62 Q9 66 14 62" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- mortarboard -->
    <polygon points="-20,42 0,35 20,42 0,49" fill="#1a1a1a"/>
    <rect x="-9" y="42" width="18" height="5" fill="#1a1a1a"/>
    <line x1="18" y1="41" x2="18" y2="54" stroke="#FFC627" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(12,54)"><line id="arm" x1="0" y1="0" x2="14" y2="-10" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/></g>
  </g>
</g>
</svg></body></html>
