<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;width:100%;height:90px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  #eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 12s linear infinite}
  @keyframes blink{0%,45%{transform:scaleY(1)} 46%{transform:scaleY(.1)} 47%,78%{transform:scaleY(1)} 79%{transform:scaleY(.1)} 80%,100%{transform:scaleY(1)}}

  #line{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 12s linear infinite}
  @keyframes draw{0%,4%{stroke-dashoffset:140} 34%,70%{stroke-dashoffset:0} 74%,100%{stroke-dashoffset:140}}
  #walk{animation:walk 12s linear infinite}
  @keyframes walk{0%,4%{transform:translate(0,0)} 34%,70%{transform:translate(132px,0)} 74%,100%{transform:translate(0,0)}}
  #glass{animation:slide 12s linear infinite}
  @keyframes slide{0%,4%{transform:translate(0,0)} 34%,70%{transform:translate(0,18px)} 74%,100%{transform:translate(0,0)}}
  #arm{transform-box:fill-box;transform-origin:0% 100%;animation:reach 12s linear infinite}
  @keyframes reach{0%,4%{transform:rotate(-70deg)} 34%,70%{transform:rotate(-20deg)} 74%,100%{transform:rotate(-70deg)}}
  #legL,#legR{transform-box:fill-box;transform-origin:50% 0}
  #legL{animation:stepL 12s linear infinite} #legR{animation:stepR 12s linear infinite}
  @keyframes stepL{0%,4%{transform:rotate(0)} 7%{transform:rotate(24deg)} 10%{transform:rotate(-24deg)} 13%{transform:rotate(24deg)} 16%{transform:rotate(-24deg)} 19%{transform:rotate(24deg)} 22%{transform:rotate(-24deg)} 25%{transform:rotate(24deg)} 28%{transform:rotate(-24deg)} 31%{transform:rotate(24deg)} 34%,100%{transform:rotate(0)}}
  @keyframes stepR{0%,4%{transform:rotate(0)} 7%{transform:rotate(-24deg)} 10%{transform:rotate(24deg)} 13%{transform:rotate(-24deg)} 16%{transform:rotate(24deg)} 19%{transform:rotate(-24deg)} 22%{transform:rotate(24deg)} 25%{transform:rotate(-24deg)} 28%{transform:rotate(24deg)} 31%{transform:rotate(-24deg)} 34%,100%{transform:rotate(0)}}
  .dot{opacity:0;animation:appear 12s linear infinite}
  @keyframes appear{0%{opacity:0} 100%{opacity:0}}
</style></head>
<body><svg viewBox="0 0 300 90" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
  <rect x="10" y="80" width="280" height="7" rx="3.5" fill="#f0efec"/>
<g transform="translate(-205,0)">

  <line x1="268" y1="6" x2="268" y2="40" stroke="#E8E8E8" stroke-width="2"/>
  <line x1="268" y1="40" x2="420" y2="40" stroke="#E8E8E8" stroke-width="2"/>
  <text x="272" y="47.5" font-family="sans-serif" font-size="6.5" fill="#8b8f94">Y1</text>
  <text x="340" y="47.5" font-family="sans-serif" font-size="6.5" fill="#8b8f94">Y5</text>
  <text x="402" y="47.5" font-family="sans-serif" font-size="6.5" fill="#8b8f94">Y10</text>
  <path id="line" d="M276 14 L310 20 L344 25 L378 29 L408 32" fill="none" stroke="#9B2247" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="walk">
  
  <g id="guy" transform="translate(255,0)">
    
    <line id="legL" x1="-5" y1="74" x2="-5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <line id="legR" x1="5" y1="74" x2="5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="58" r="16" fill="#9B2247"/>
    <ellipse cx="-5" cy="50" rx="6" ry="4" fill="#fff" opacity=".14"/>
    <g id="eyes">
      <circle cx="5" cy="54" r="3.4" fill="#fff"/><circle cx="11" cy="54" r="3.4" fill="#fff"/>
      <circle cx="6" cy="54.5" r="1.5" fill="#1a1a1a"/><circle cx="12" cy="54.5" r="1.5" fill="#1a1a1a"/>
    </g>
    <path d="M4 62 Q9 66 14 62" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- mortarboard -->
    <polygon points="-20,42 0,35 20,42 0,49" fill="#1a1a1a"/>
    <rect x="-9" y="42" width="18" height="5" fill="#1a1a1a"/>
    <line x1="18" y1="41" x2="18" y2="54" stroke="#FFC627" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(12,54)"><line id="arm" x1="0" y1="0" x2="18" y2="-6" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/></g>
  </g>
  <g id="glass">
    <line x1="270" y1="32" x2="267" y2="40" stroke="#5b4636" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="274" cy="21" r="10" fill="#dbeeff" fill-opacity=".45" stroke="#5b4636" stroke-width="2.5"/>
    <path d="M269 16.5 q3 -3 7 -3" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".8"/>
  </g>
  </g>
</g>
</svg></body></html>
