<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;width:100%;height:90px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  #eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 12s linear infinite}
  @keyframes blink{0%,45%{transform:scaleY(1)} 46%{transform:scaleY(.1)} 47%,78%{transform:scaleY(1)} 79%{transform:scaleY(.1)} 80%,100%{transform:scaleY(1)}}

  #arm{transform-box:fill-box;transform-origin:0% 100%;animation:scratch 12s linear infinite}
  @keyframes scratch{0%{transform:rotate(-95deg)} 6%{transform:rotate(-120deg)} 10%{transform:rotate(-95deg)}
    14%{transform:rotate(-120deg)} 18%{transform:rotate(-95deg)} 24%,100%{transform:rotate(60deg)}}
  #head{animation:nod 12s linear infinite}
  @keyframes nod{0%,24%{transform:translateY(0)} 27%{transform:translateY(3px)} 30%{transform:translateY(0)}
    33%{transform:translateY(3px)} 36%,100%{transform:translateY(0)}}
  .board{opacity:0;animation:pop 12s linear infinite}
  @keyframes pop{0%{opacity:0;transform:translateX(-6px)} 4%,100%{opacity:1;transform:translateX(0)}}
</style></head>
<body><svg viewBox="0 0 300 90" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
  <rect x="10" y="80" width="280" height="7" rx="3.5" fill="#f0efec"/>
<g transform="translate(-205,0)">

  <rect x="330" y="20" width="4" height="62" rx="1.5" fill="#a07a56"/>
  <g class="board" style="animation-delay:0.0s"><polygon points="332,24 302,24 296,30 302,36 332,36" fill="#2a78d6"/><text x="306" y="33.5" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">AZ</text></g><g class="board" style="animation-delay:0.35s"><polygon points="332,38 362,38 368,44 362,50 332,50" fill="#eb6834"/><text x="340" y="47.5" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">TX</text></g><g class="board" style="animation-delay:0.7s"><polygon points="332,52 302,52 296,58 302,64 332,64" fill="#8bc34a"/><text x="306" y="61.5" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">NY</text></g><g class="board" style="animation-delay:1.0499999999999998s"><polygon points="332,66 362,66 368,72 362,78 332,78" fill="#ad1457"/><text x="340" y="75.5" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">OH</text></g>
  <g id="head">
  
  <g id="guy" transform="translate(250,0)">
    
    <line id="legL" x1="-5" y1="74" x2="-5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <line id="legR" x1="5" y1="74" x2="5" y2="82" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="58" r="16" fill="#9B2247"/>
    <ellipse cx="-5" cy="50" rx="6" ry="4" fill="#fff" opacity=".14"/>
    <g id="eyes">
      <circle cx="5" cy="54" r="3.4" fill="#fff"/><circle cx="11" cy="54" r="3.4" fill="#fff"/>
      <circle cx="6" cy="54.5" r="1.5" fill="#1a1a1a"/><circle cx="12" cy="54.5" r="1.5" fill="#1a1a1a"/>
    </g>
    <path d="M4 62 Q9 66 14 62" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- mortarboard -->
    <polygon points="-20,42 0,35 20,42 0,49" fill="#1a1a1a"/>
    <rect x="-9" y="42" width="18" height="5" fill="#1a1a1a"/>
    <line x1="18" y1="41" x2="18" y2="54" stroke="#FFC627" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(12,54)"><line id="arm" x1="0" y1="0" x2="12" y2="-12" stroke="#9B2247" stroke-width="4" stroke-linecap="round"/></g>
  </g>
  </g>
</g>
</svg></body></html>
